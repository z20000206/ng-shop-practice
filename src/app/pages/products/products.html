<section class="c-products">
  <header class="c-products__header">
    <h1>商品列表</h1>
    <!-- loading$ 為 signal，需呼叫以取得值 -->
    <div class="u-status" *ngIf="loading$()">載入中...</div>
  </header>

  <ul class="c-products__list">
    <li class="c-products__item" *ngFor="let p of products$()">
      <img class="c-products__cover" [src]="p.cover || 'https://placehold.co/80'" alt="" />
      <div class="c-products__meta">
        <h3 class="c-products__title">{{ p.title }}</h3>
        <div class="c-products__price">${{ p.price }}</div>
        <div class="c-products__stock">庫存：{{ p.stock }}</div>
      </div>
      <div class="c-products__ops">
        <a [routerLink]="['/products', p.id]">編輯</a>
        <button (click)="remove(p.id)">刪除</button>
      </div>
    </li>
  </ul>

  <h2>新增商品</h2>
  <!-- [formGroup] 綁定到 component 的 form 屬性 -->
  <!-- (ngSubmit) 綁定到 create() 方法 -->
  <!-- novalidate 禁用瀏覽器內建驗證 -->
  <!-- autocomplete="off" 關閉自動填充 -->
  <form class="c-form" [formGroup]="form" (ngSubmit)="create()" novalidate autocomplete="off">
    <label>
      名稱
      <input
        formControlName="title"
        required
        placeholder="例：ASUS Zenbook 14 OLED"
        aria-describedby="titleHint"
      />
      <!-- form.controls['title'] 為 Reactive Forms 的語法，用來取得指定欄位的控制項 (FormControl) -->
      <!-- 
      touched 使用者「碰過」欄位
      untouched 使用者「尚未碰過」欄位
      dirty 欄位內容「有改變」
      pristine 欄位內容「保持原樣」
      valid 欄位「有效」 
      invalid 欄位「無效」
      --> 
      <!-- 如果 title 欄位被觸碰過且無效，顯示錯誤訊息 -->
      <small
        class="c-form__error"
        *ngIf="form.controls['title'].touched && form.controls['title'].invalid"
      >
        請輸入名稱
      </small>
    </label>

    <label>
      價格
      <input
        formControlName="price"
        placeholder="例：34900"
      />
      <small
        class="c-form__error"
        *ngIf="form.controls['price'].touched && form.controls['price'].invalid"
      >
        價格需為 0 以上數字
      </small>
    </label>

    <label>
      庫存
      <input
        type="number"
        formControlName="stock"
        inputmode="numeric"
        min="0"
        step="1"
        placeholder="例：8"
      />
      <small
        class="c-form__error"
        *ngIf="form.controls['stock'].touched && form.controls['stock'].invalid"
      >
        庫存需為 0 以上整數
      </small>
    </label>

    <label>
      圖片
      <!-- onFileSelected 方法會處理檔案選擇事件 -->
      <input type="file" accept="image/*" (change)="onFileSelected($event)" />
      <small class="c-form__hint">選擇商品圖片（PNG、JPG、WebP）</small>
    </label>
    
    <div class="c-form__preview" *ngIf="previewUrl()">
      <img [src]="previewUrl()" alt="預覽圖片" />
    </div>

    <button type="submit" [disabled]="form.invalid">建立</button>
  </form>
</section>
